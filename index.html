<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sang89vh — Mobile Apps</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #0f1220;
    color: #e8eaf2;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    max-width: 560px;
    width: 100%;
    background: #181c30;
    border: 1px solid #2a3050;
    border-radius: 16px;
    padding: 40px 32px;
    text-align: center;
  }
  h1 { font-size: 28px; margin-bottom: 8px; }
  .tagline { color: #9aa3c0; font-size: 16px; margin-bottom: 28px; }
  .apps {
    text-align: left;
    background: #10142a;
    border: 1px solid #2a3050;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 24px;
  }
  .apps h2 { font-size: 15px; color: #9aa3c0; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
  .apps p { font-size: 15px; line-height: 1.7; }
  .stores { color: #9aa3c0; font-size: 14px; line-height: 1.6; }
</style>
</head>
<body>
  <div class="card">
    <h1>Sang89vh</h1>
    <p class="tagline">Indie mobile apps &amp; games</p>

    <!-- Bạn có thể sửa phần này: liệt kê các app của bạn, thêm link App Store / Google Play -->
    <div class="apps">
      <h2>My Apps</h2>
      <p>Fun games and useful apps for everyone — available on the App Store and Google Play.</p>
    </div>

    <p class="stores">Find our apps on the Apple App Store and Google Play Store.</p>
  </div>
</body>
</html>
